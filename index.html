<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the scene runs under notches and the home indicator; the HUD stays
         inside the safe area (CSS --safe-*). Page zoom stays allowed: the canvas has touch-action:
         none, so pinching the scene zooms the scene, and pinching the HUD still zooms the page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Synthwave coloring-book style Three.js animation of a Polonez driving into the sunset, with a minigame."
    />
    <title>Polonez Autodrive</title>
    <link rel="icon" href="./favicon.ico" />
    <!-- dark browser background from the first paint, not a white flash -->
    <meta name="color-scheme" content="dark" />
    <!-- browser chrome in the UI pink (content set by ui/theme.js from PALETTE) -->
    <meta name="theme-color" content="" />
    <!-- nothing shows until the styles and theme.js colors are in (no unstyled flash); kept
         inline, as the stylesheet itself arrives later -->
    <style>
      :root:not([data-theme]) body {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div class="loader" id="loader" role="status" aria-live="polite">
      <div class="loader__terminal">
        <div class="loader__header"></div>
        <div class="loader__content">
          <div class="loader__text"></div>
          <div class="loader__progress"></div>
          <div class="loader__status"></div>
          <span class="loader__cursor" aria-hidden="true">█</span>
        </div>
      </div>
    </div>
    <div class="hud" id="hud">
      <section class="hud__menu" data-label="menu">
        <!-- Like the DISPLAY/OSD button of an 80s remote: hides the menu, keeps the scene. -->
        <button class="button button--small hud__toggle" type="button" data-action="menu">
          <span class="hud__toggle-icon" data-icon="eye"></span>
          <span data-text="hide"></span><kbd data-key="menu"></kbd>
        </button>
        <h1 class="logo hud__fade">
          <span class="logo__script sunset-text" data-text="logoScript"></span>
          <span class="logo__caps" data-text="logoCaps"></span>
        </h1>
        <p class="hud__best hud__fade" hidden>
          <span data-text="best"></span> <span data-best></span>
        </p>
        <!-- equal columns keep both buttons the same width; the steering hint spans both -->
        <div class="button-grid hud__bottom">
          <button class="button button--primary hud__fade" type="button" data-action="start">
            <span data-text="menuStart"></span><kbd data-key="start"></kbd>
          </button>
          <button class="button hud__fade" type="button" data-action="free">
            <span data-text="freeRide"></span><kbd data-key="free"></kbd>
          </button>
          <p class="hud__steer hud__fade">
            <span><kbd data-key="left"></kbd><kbd data-key="right"></kbd></span>
            <span data-text="steer"></span>
          </p>
        </div>
      </section>

      <div class="hud__corner panel">
        <span class="hud__tag" data-text="freeRide"></span>
        <kbd data-key="left"></kbd><kbd data-key="right"></kbd> <span data-text="steer"></span>
        <span class="hud__dot">·</span>
        <kbd data-key="exit"></kbd> <span data-text="exit"></span>
      </div>

      <!-- Touch screens in free ride: steering held like the arrow keys, and a way back. -->
      <div class="hud__touch">
        <button class="button hud__touch-steer" type="button" data-hold="left">
          <span data-key="left"></span>
        </button>
        <button class="button" type="button" data-action="exit">
          <span data-text="menu"></span>
        </button>
        <button class="button hud__touch-steer" type="button" data-hold="right">
          <span data-key="right"></span>
        </button>
      </div>

      <div class="hud__countdown sunset-text" hidden></div>

      <div class="hud__scoreboard panel" aria-live="polite" hidden>
        <div class="stat">
          <span class="stat__label" data-text="best"></span
          ><span class="stat__value" data-best></span>
        </div>
        <div class="stat stat--main">
          <span class="stat__label" data-text="score"></span
          ><span class="stat__value" data-score></span>
        </div>
        <div class="stat">
          <span class="stat__label" data-text="level"></span
          ><span class="stat__value" data-level></span>
        </div>
      </div>

      <div class="hud__flash" aria-hidden="true"></div>

      <section class="hud__gameover panel" data-label="gameOver" aria-live="assertive">
        <h2 class="hud__gameover-title sunset-text" data-text="gameOver"></h2>
        <!-- the score is the headline; the record sits under it, or NEW BEST! when it was beaten -->
        <div class="hud__final">
          <span class="hud__final-label" data-text="score"></span>
          <span class="hud__final-score" data-final-score></span>
          <p class="hud__new-best" data-text="newBest" hidden></p>
          <p class="hud__final-best">
            <span data-text="best"></span> <span class="hud__final-best-value" data-best></span>
          </p>
        </div>
        <div class="button-grid button-grid--3">
          <button class="button button--primary" type="button" data-action="start">
            <span data-text="again"></span><kbd data-key="start"></kbd>
          </button>
          <button class="button" type="button" data-action="free">
            <span data-text="freeRide"></span><kbd data-key="free"></kbd>
          </button>
          <button class="button" type="button" data-action="exit">
            <span data-text="menu"></span><kbd data-key="exit"></kbd>
          </button>
        </div>
      </section>
    </div>
    <!-- F10 developer stats (ui/devstats.js fills the texts and values) -->
    <div class="devstats panel" id="devstats" hidden>
      <div class="devstats__header" data-text="title"></div>
      <div class="devstats__fps">
        <span class="devstats__fps-value" data-fps>--</span><span data-text="fps"></span>
      </div>
      <dl class="devstats__rows">
        <dt data-text="calls"></dt>
        <dd data-stat="calls">--</dd>
        <dt data-text="triangles"></dt>
        <dd data-stat="triangles">--</dd>
        <dt data-text="geometries"></dt>
        <dd data-stat="geometries">--</dd>
        <dt data-text="textures"></dt>
        <dd data-stat="textures">--</dd>
        <dt data-text="programs"></dt>
        <dd data-stat="programs">--</dd>
      </dl>
    </div>
    <div class="crt" id="crt" aria-hidden="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
